name: CI

# Quality gate every change before it can reach main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy credentials so `src.config` validation passes at import time.
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/docmind_test
  REDIS_URL: redis://localhost:6379/0
  OPENAI_API_KEY: ci-dummy-key
  EMBEDDING_PROVIDER: openai
  LLM_PROVIDER: openai
  DEBUG: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-python
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-python
      - name: mypy
        run: mypy src

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-python
      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=60
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  migrations-and-integration:
    name: Migrations + integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/docmind_test
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ci-dummy-key
      EMBEDDING_DIM: "1536"
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-python
      - name: Apply migrations and check for schema drift
        run: |
          alembic upgrade head
          alembic check
      - name: Run integration tests
        run: pytest -m integration -q
