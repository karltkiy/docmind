services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docmind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Required: no insecure fallback password is provided. Set it in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docmind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: docmind_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      UPLOAD_DIR: /data/uploads
      OLLAMA_BASE_URL: http://ollama:11434
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    container_name: docmind_worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      UPLOAD_DIR: /data/uploads
      OLLAMA_BASE_URL: http://ollama:11434
      DEBUG: ${DEBUG:-false}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: arq src.worker.tasks.WorkerSettings
    # The image-level HEALTHCHECK targets the API surface; the Arq worker has no
    # HTTP endpoint, so the inherited probe is disabled for this service.
    healthcheck:
      disable: true

  ollama:
    image: ollama/ollama:latest
    container_name: docmind_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: docmind_ollama_init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} &&
       ollama pull ${LLM_MODEL:-llama3.1:8b}"

  demo:
    build: .
    container_name: docmind_demo
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DOCMIND_API_URL: http://api:8000/api/v1
      DOCMIND_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run demo/app_ui.py --server.port 8501 --server.address 0.0.0.0
    healthcheck:
      # Streamlit exposes a lightweight readiness endpoint at /_stcore/health.
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pg_data:
  uploads:
  ollama_data:
