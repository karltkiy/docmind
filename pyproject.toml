[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docmind-api"
version = "1.0.0"
description = "Enterprise RAG microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.0",
    "arq>=0.26.0",
    "redis>=5.0.1",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "alembic", "demo", "alembic.ini", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)`/`File(...)` idiom relies on calls in defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
