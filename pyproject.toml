[project]
name = "docmind-api"
version = "0.1.0"
description = "Enterprise RAG microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.1.0",
    "alembic>=1.13.0",
    "arq>=0.11.0",
    "redis>=5.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.30.0",
]

[tool.poetry]
# If using poetry, but since I'm using pyproject.toml for standard pip/uv
# I'll stick to standard PEP 621.

[tool.uv]
# Optional if using uv
dev-dependencies = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]
