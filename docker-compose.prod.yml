# Production stack for the VPS. Standalone (not an overlay) so there is no
# ambiguity about which ports/databases are exposed in production.
#
#   DOCMIND_IMAGE=ghcr.io/karltkiy/docmind IMAGE_TAG=sha-<sha> \
#     docker compose -f docker-compose.prod.yml up -d --no-build
#
# Deployed by .github/workflows/deploy.yml. Secrets live in a server-side .env.
name: docmind-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  POSTGRES_HOST: db
  REDIS_HOST: redis
  OLLAMA_BASE_URL: http://ollama:11434
  UPLOAD_DIR: /data/uploads
  LOG_JSON: "True"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # No published ports: reachable only on the internal Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  api:
    image: ${DOCMIND_IMAGE:?set DOCMIND_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-env
      DEBUG: "False"
    ports:
      # Bind to loopback only; terminate TLS in a reverse proxy (nginx/Caddy).
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  worker:
    image: ${DOCMIND_IMAGE:?set DOCMIND_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-env
      DEBUG: "False"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: arq src.worker.tasks.WorkerSettings
    # The image-level HEALTHCHECK targets the API surface; the Arq worker has no
    # HTTP endpoint, so the inherited probe is disabled for this service.
    healthcheck:
      disable: true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} &&
       ollama pull ${LLM_MODEL:-llama3.1:8b}"
    logging: *default-logging

volumes:
  pg_data:
  redis_data:
  uploads:
  ollama_data:
